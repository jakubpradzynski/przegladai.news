<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>PrzeglądAI – nowe wpisy ze stron</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#e3e5e8; --text:#1d1f23; --muted:#6b7079; --accent:#5b2a86;
          --ok:#1e8e3e; --warn:#b06000; --bad:#c5221f; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  header { position:sticky; top:0; z-index:5; background:var(--card); border-bottom:1px solid var(--line); padding:10px 20px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  .muted { color:var(--muted); }
  .spacer { flex:1; }
  button { font:inherit; cursor:pointer; border-radius:6px; }
  .btn { border:1px solid var(--line); background:#fff; padding:7px 14px; }
  .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  .btn:disabled { opacity:.5; cursor:default; }
  main { max-width:1100px; margin:0 auto; padding:14px 20px 80px; }
  details.status { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 14px; margin-bottom:14px; }
  details.status summary { cursor:pointer; font-weight:600; }
  .sites { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:4px 16px; margin-top:10px; font-size:13px; }
  .site-row { display:flex; gap:6px; }
  .ico { width:16px; flex:none; text-align:center; font-weight:700; }
  .ico.ok { color:var(--ok); } .ico.uwaga, .ico.przegladarka { color:var(--warn); } .ico.problem, .ico.blad { color:var(--bad); }
  h2 { font-size:15px; margin:22px 0 6px; display:flex; gap:8px; align-items:baseline; }
  h2 a { color:var(--muted); font-size:12px; font-weight:normal; }
  .item { background:var(--card); border:1px solid var(--line); border-left:4px solid transparent; border-radius:8px; padding:9px 12px; margin:5px 0; display:grid; grid-template-columns:26px 1fr 110px; gap:10px; cursor:pointer; }
  .item.focus { outline:2px solid #c9b3e0; }
  .item.chosen { border-left-color:var(--accent); background:#faf7fd; }
  .item.done { opacity:.45; }
  .item input { width:17px; height:17px; margin-top:2px; cursor:pointer; }
  .title { font-weight:600; color:var(--text); text-decoration:none; }
  .title:hover { text-decoration:underline; }
  .desc { color:#444; font-size:13px; margin-top:2px; }
  .meta { font-size:12px; color:var(--muted); text-align:right; }
  .badge { display:inline-block; font-size:11px; padding:1px 7px; border-radius:10px; background:#eef0f3; margin-top:4px; }
  .result { background:#e6f4ea; color:var(--ok); border-radius:8px; padding:10px 14px; margin:10px 0; font-weight:600; }
  kbd { background:#eef0f3; border-radius:3px; padding:0 5px; font-size:12px; }
  .section { font-size:16px; margin:26px 0 4px; padding-bottom:4px; border-bottom:2px solid var(--line); display:flex; gap:10px; align-items:baseline; }
  .section.tak { border-color:var(--accent); } .section.nie { border-color:#ccc; cursor:pointer; }
  .why { font-size:12px; color:var(--accent); margin-top:3px; }
  .why.nie { color:var(--muted); }
  .site-tag { font-size:11px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Nowe wpisy ze stron</h1>
  <span class="muted" id="range"></span>
  <span class="spacer"></span>
  <label class="muted"><input type="checkbox" id="hide-known" checked> ukryj już dodane do data.csv</label>
  <span class="muted" id="count"></span>
  <button class="btn primary" id="save">Zapisz wybrane do data.csv</button>
</header>
<main>
  <div id="result"></div>
  <details class="status" id="status"><summary id="status-summary"></summary><div class="sites" id="sites"></div></details>
  <p class="muted"><kbd>↑</kbd><kbd>↓</kbd> albo <kbd>J</kbd><kbd>K</kbd> — poruszanie · <kbd>Spacja</kbd> — zaznacz / odznacz · <kbd>O</kbd> — otwórz artykuł w nowej karcie</p>
  <div id="items"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let data, flat = [], chosen = new Set(), focus = 0;
const ICON = {ok: '✓', uwaga: '!', przegladarka: '?', problem: '✕', blad: '✕'};

async function load() {
  const res = await (await fetch('/api/wpisy')).json();
  data = res.wynik;
  const all = data.strony.flatMap(st => st.nowe);
  chosen = new Set(res.sesja?.wybrane ?? all.filter(i => i.ocena === 'tak' && !i.w_data_csv).map(i => i.link));
  rejectedOpen = !!res.sesja?.odrzucone_otwarte;
  $('range').textContent = `wpisy od ${data.od}`;
  renderStatus(); render();
}

function renderStatus() {
  const sites = data.strony;
  const bad = sites.filter(s => s.status !== 'ok');
  const withNews = sites.filter(s => s.nowe.length);
  $('status-summary').innerHTML = `Stan stron: ${sites.length} sprawdzonych, ${withNews.length} z nowymi wpisami, ` +
    (bad.length ? `<span style="color:var(--bad)">${bad.length} wymaga uwagi</span>` : '<span style="color:var(--ok)">wszystkie dostępne</span>');
  if (bad.length) $('status').open = true;
  $('sites').innerHTML = sites.map(s => `<div class="site-row"><span class="ico ${s.status}">${ICON[s.status] || '?'}</span>
    <span><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.nazwa)}</a> — ${s.nowe.length ? `<b>${s.nowe.length} nowych</b>` : 'brak nowych'}
    ${s.komunikat ? `<span class="muted"> · ${esc(s.komunikat)}</span>` : ''}</span></div>`).join('');
}

const SECTIONS = [
  {key: 'tak', title: 'Proponowane', hint: 'AI uważa, że to materiał do wydania — zaznaczone od razu, odznacz, jeśli nie'},
  {key: 'moze', title: 'Do decyzji', hint: 'AI nie jest pewne — zdecyduj'},
  {key: 'nie', title: 'Odrzucone przez AI', hint: 'według reguł z redakcja/preselekcja.md — kliknij, żeby rozwinąć i sprawdzić'},
];
let rejectedOpen = false;

function itemHtml(it, k) {
  const on = chosen.has(it.link);
  return `<div class="item ${on ? 'chosen' : ''} ${it.w_data_csv ? 'done' : ''}" data-k="${k}">
    <input type="checkbox" ${on ? 'checked' : ''} tabindex="-1">
    <div><a class="title" href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.tytul)}</a>
      ${it.opis ? `<div class="desc">${esc(it.opis)}</div>` : ''}
      ${it.powod ? `<div class="why ${it.ocena}">AI: ${esc(it.powod)}</div>` : ''}</div>
    <div class="meta"><span class="site-tag">${esc(it.strona)}</span><br>${esc(it.data)}
      ${it.w_data_csv ? '<br><span class="badge">już w data.csv</span>' : ''}
      ${it.opublikowany ? '<br><span class="badge">był w wydaniu</span>' : ''}
      ${it.przegladarka ? '<br><span class="badge">z przeglądarki</span>' : ''}</div></div>`;
}

function render() {
  const hide = $('hide-known').checked;
  const all = [];
  for (const s of data.strony) for (const it of s.nowe) if (!(hide && it.w_data_csv)) all.push({...it, strona: s.nazwa});
  flat = [];
  let html = '';
  for (const sec of SECTIONS) {
    const items = all.filter(i => (i.ocena || 'moze') === sec.key)
      .sort((a, b) => a.strona.localeCompare(b.strona) || b.data.localeCompare(a.data));
    if (!items.length) continue;
    const collapsed = sec.key === 'nie' && !rejectedOpen;
    html += `<div class="section ${sec.key}" ${sec.key === 'nie' ? 'id="toggle-rejected"' : ''}>
      ${sec.key === 'nie' ? (collapsed ? '▶' : '▼') : ''} ${sec.title} <span class="muted">${items.length}</span>
      <span class="muted" style="font-size:12px;font-weight:normal">${sec.hint}</span></div>`;
    if (collapsed) continue;
    for (const it of items) { html += itemHtml(it, flat.length); flat.push(it); }
  }
  if (!data.preselekcja) html = '<p class="muted">Brak preselekcji AI — wszystkie wpisy są w sekcji „Do decyzji”.</p>' + html;
  $('items').innerHTML = html || '<p>Brak nowych wpisów od ostatniego wydania. Wszystkie strony sprawdzone — szczegóły w „Stan stron”.</p>';
  $('toggle-rejected')?.addEventListener('click', () => { rejectedOpen = !rejectedOpen; persist(); render(); });
  focus = Math.min(focus, Math.max(0, flat.length - 1));
  highlight(false);
  $('count').textContent = `wybrane: ${chosen.size}`;
  $('save').disabled = !chosen.size;
}

function persist() {
  fetch('/api/sesja', {method: 'POST', body: JSON.stringify({wybrane: [...chosen], odrzucone_otwarte: rejectedOpen})});
}

function highlight(scroll = true) {
  document.querySelectorAll('.item').forEach(el => el.classList.toggle('focus', +el.dataset.k === focus));
  if (scroll) document.querySelector(`.item[data-k="${focus}"]`)?.scrollIntoView({block: 'center'});
}

function toggle(k) {
  const link = flat[k].link;
  chosen.has(link) ? chosen.delete(link) : chosen.add(link);
  persist();
  const el = document.querySelector(`.item[data-k="${k}"]`);
  el.classList.toggle('chosen', chosen.has(link));
  el.querySelector('input').checked = chosen.has(link);
  $('count').textContent = `wybrane: ${chosen.size}`;
  $('save').disabled = !chosen.size;
}

$('items').addEventListener('click', e => {
  const el = e.target.closest('.item');
  if (!el || e.target.closest('a')) return;
  focus = +el.dataset.k; highlight(false); toggle(focus);
});

document.addEventListener('keydown', e => {
  if (!flat.length || e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') return;
  if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); focus = Math.min(flat.length - 1, focus + 1); highlight(); }
  else if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); focus = Math.max(0, focus - 1); highlight(); }
  else if (e.key === ' ') { e.preventDefault(); toggle(focus); }
  else if (e.key === 'o' || e.key === 'O') window.open(flat[focus].link, '_blank', 'noopener');
});

$('hide-known').onchange = render;

$('save').onclick = async () => {
  const perSite = {};
  data.strony.forEach(st => st.nowe.filter(i => chosen.has(i.link)).forEach(() => perSite[st.nazwa] = (perSite[st.nazwa] || 0) + 1));
  const res = await (await fetch('/api/zapisz', {method: 'POST', body: JSON.stringify({linki: [...chosen], na_strone: perSite, odrzucone_otwarte: rejectedOpen})})).json();
  $('result').innerHTML = `<div class="result">Dodano do data.csv: ${res.dodane}${res.pominiete ? ` (pominięte, bo już były: ${res.pominiete})` : ''}. Możesz zamknąć tę kartę.</div>`;
  chosen = new Set();
  const again = await (await fetch('/api/wpisy')).json();
  data = again.wynik; render();
  window.scrollTo(0, 0);
};

load();
</script>
</body>
</html>
